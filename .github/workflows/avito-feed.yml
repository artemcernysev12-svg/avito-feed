name: Avito feed (наличие и сроки)

on:
  schedule:
    # Остатки робот сайта кладёт в 01:37 / 03:07 по Стерлитамаку — наш прогон после них.
    - cron: "30 5 * * *"
      timezone: "Asia/Yekaterinburg"
    # Запасной прогон (если утренний GitHub задержал/пропустил). Повтор безопасен.
    - cron: "30 8 * * *"
      timezone: "Asia/Yekaterinburg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Собрать файл Авито
        id: feed
        run: |
          set +e
          python avito_feed.py --download
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 = защита (старые остатки / мало объявлений): вчерашний файл остаётся, прогон не «красный»
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit $code; fi
      - name: Сохранить
        if: steps.feed.outputs.code == '0'
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "avito-feed-bot@users.noreply.github.com"
          git add avito.xlsx
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "Авито: наличие и сроки $(TZ=Asia/Yekaterinburg date +%d.%m.%Y)"
          git push
