name: Avito feed (наличие и сроки)

on:
  schedule:
    # Время — UTC. GitHub запускает по расписанию с опозданием до нескольких часов (25.10: вместо 00:10 — 04:28),
    # поэтому запасные прогоны каждый час до 08:00 UTC; повтор безопасен (без изменений — без коммита).
    - cron: "10 0-8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: avito-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Собрать файл Авито
        id: feed
        run: |
          set +e
          python avito_feed.py --download
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2 = защита (старые остатки / мало объявлений): вчерашний файл остаётся, прогон не «красный»
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit $code; fi
      - name: Сохранить
        if: steps.feed.outputs.code == '0'
        run: |
          git config user.name "avito-feed-bot"
          git config user.email "avito-feed-bot@users.noreply.github.com"
          git add avito.xlsx
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -m "Авито: наличие и сроки $(TZ=Asia/Yekaterinburg date +%d.%m.%Y)"
          git push
      - name: Количество на Авито (API «Управление остатками»)
        if: steps.feed.outputs.code == '0'
        continue-on-error: true            # сбой API количества не мешает файлу (25.10)
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          # раз в неделю (воскресенье) заново узнаём, у каких объявлений есть «количество» (новые с Авито Доставкой)
          if [ "$(date -u +%u)" = "7" ]; then python avito_stock.py --write --refresh-ids; else python avito_stock.py --write; fi
          git add base/avito-stock-ids.json
          git diff --cached --quiet || { git commit -m "Авито: список объявлений с количеством" && git push; }
